# A local copy of production for testing: same API code and settings,
# MariaDB 10.11, Redis 7, nginx in front with the production site settings.
# Cloudinary and Mailtrap are replaced by the "fakes" service.
#
# Start with scripts/up.sh, not directly: it creates the secrets,
# certificate and student-site build this file expects in .state/.
name: studentx-staging

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: studentx
      MARIADB_USER: studentx
      MARIADB_PASSWORD: ${DB_PASSWORD:?run scripts/up.sh}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run scripts/up.sh}
    volumes:
      - db:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  redis:
    image: redis:7.0

  fakes:
    image: python:3.12-slim
    command: ["python", "/fakes/server.py"]
    environment:
      UPLOAD_DELAY: ${UPLOAD_DELAY:-2}
    volumes:
      - ./fakes:/fakes:ro
    ports:
      - "127.0.0.1:9900:9000"

  api:
    build:
      context: ..
      dockerfile: staging-env/backend.Dockerfile
      args:
        REVISION: ${REVISION:-unknown}
    image: studentx-staging-api
    env_file: .state/api.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: studentx
      DB_USER: studentx
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # Every upload goes to the local stand-in, never to Cloudinary.
      CLOUDINARY_UPLOAD_PREFIX: http://fakes:9000
      CLOUDINARY_CLOUD_NAME: staging
      CLOUDINARY_API_KEY: staging-key
      CLOUDINARY_API_SECRET: staging-secret
      MAILTRAP_API_TOKEN: staging
      MAILTRAP_STAND_IN: http://fakes:9000
      FRONTEND_URL: http://localhost:8081
      FRONTEND_BASE_URL: http://localhost:8081
      BACKEND_URL: https://localhost:8443
    # Production has 4 CPUs shared with other applications.
    cpus: ${API_CPUS:-2}
    ports:
      # Direct to gunicorn, for load tests that simulate many visitor addresses.
      - "127.0.0.1:6060:6060"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      fakes:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6060/healthz"]
      interval: 3s
      retries: 40

  proxy:
    image: nginx:1.24
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.state/certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    depends_on:
      - api

  web:
    image: nginx:1.24
    volumes:
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.state/frontend-dist:/usr/share/nginx/html:ro
    ports:
      # An origin the API already allows (CORS), so no code change is needed.
      - "127.0.0.1:8081:80"

  admin:
    image: nginx:1.24
    volumes:
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.state/admin-dist:/usr/share/nginx/html:ro
    ports:
      # Also an origin the API already allows.
      - "127.0.0.1:8080:80"

volumes:
  db:
