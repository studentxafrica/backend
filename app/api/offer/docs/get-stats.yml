swagger: "2.0"
info:
  title: Get Offer Statistics
  description: Get statistics for a specific offer
  version: "1.0.0"
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /offer/{id}/stats:
    get:
      tags:
        - offer
      summary: Get offer statistics
      description: Get statistics for a specific offer
      parameters:
        - name: id
          in: path
          type: integer
          required: true
          description: ID of the offer
      security:
        - Bearer: []
      responses:
        "200":
          description: Successfully retrieved offer statistics
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Successfully fetched offer statistics"
              data:
                type: object
                properties:
                  total_views:
                    type: integer
                    example: 1000
                  total_coupons:
                    type: integer
                    example: 500
                  redeemed_coupons:
                    type: integer
                    example: 300
                  active_coupons:
                    type: integer
                    example: 200
                  views_by_day:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2024-03-20"
                        count:
                          type: integer
                          example: 50
                  coupons_by_day:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2024-03-20"
                        count:
                          type: integer
                          example: 25
        "401":
          description: Unauthorized
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthorized"
        "404":
          description: Offer not found
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Offer not found" 