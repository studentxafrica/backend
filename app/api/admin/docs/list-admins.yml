swagger: "2.0"
info:
  title: List Admins
  description: Get a list of all admin users.
  version: "1.0.0"
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /admin/list:
    get:
      tags:
        - admin
      summary: List all admins
      description: Returns a list of admin users.
      parameters: []
      responses:
        "200":
          description: A list of admins
          schema:
            type: array
            items:
              $ref: '#/definitions/Admin'
        "500":
          description: Internal server error
          schema:
            type: object
            properties:
              message:
                type: string
definitions:
  Admin:
    type: object
    properties:
      id:
        type: integer
      username:
        type: string
      email:
        type: string
      role:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time 