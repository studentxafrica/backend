swagger: "2.0"
info:
  title: List Categories
  description: Get a list of all categories.
  version: "1.0.0"
schemes:
  - http
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /category/list:
    get:
      tags:
        - category
      summary: List all categories
      description: Returns a list of categories.
      parameters: []
      responses:
        "200":
          description: A list of categories
          schema:
            type: array
            items:
              $ref: '#/definitions/Category'
        "500":
          description: Internal server error
          schema:
            type: object
            properties:
              message:
                type: string
definitions:
  Category:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      description:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time 