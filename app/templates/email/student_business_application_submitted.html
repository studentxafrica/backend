<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Application Received</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.6;">
  <h2 style="margin-bottom: 8px;">Application Received</h2>
  <p>Hi {{ student_name }},</p>
  <p>
    We have received your student-owned business application for
    <strong>{{ business_name }}</strong>.

    Our admin team will review your submission and update you by email.
  </p>

</body>
</html>
